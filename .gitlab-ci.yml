# Tests aryeo/tooling-laravel and publishes it to the Artifactory Composer repository.
#
# Branches run the tests. A semver tag push (e.g. 0.0.41) runs the tests, packages the
# tagged source and publishes it.
#
# The job scripts come from the shared template.
include:
  - project: vendor-platform/ci_cd/gitlab-ci-templates
    ref: main
    file: php-composer-package.yml

stages:
  - test
  - package
  - publish

default:
  tags:
    - build
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

tests:
  stage: test
  extends: .php-tests
  parallel:
    matrix:
      - COMPOSER_REQUIRE: "laravel/framework:12.* orchestra/testbench:10.*"
      - COMPOSER_REQUIRE: "laravel/framework:13.* orchestra/testbench:11.*"

package:
  stage: package
  extends: .package
  needs: [tests]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/

publish:
  stage: publish
  extends: .publish
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
